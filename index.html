<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌍 आसी वर्ल्ड - AI Brain Leader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a1a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        canvas {
            display: block;
        }

        #chat-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: min(640px, 94%);
            background: rgba(10, 10, 30, 0.88);
            backdrop-filter: blur(18px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 150, 255, 0.06);
            padding: 14px 18px 18px;
            z-index: 100;
            transition: transform 0.3s ease, opacity 0.3s ease;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        #chat-container.minimized {
            transform: translateX(-50%) translateY(calc(100% - 64px));
            opacity: 0.7;
        }
        #chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }
        #chat-header .badge {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 11px;
            letter-spacing: 0.5px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #chat-header .badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #44ff88;
            animation: pulse-dot 1.2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }
        #chat-header .toggle-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 18px;
            cursor: pointer;
            padding: 0 6px;
        }
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 4px 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
            max-height: 220px;
            min-height: 60px;
        }
        #chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        #chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .msg {
            padding: 8px 14px;
            border-radius: 18px;
            max-width: 92%;
            font-size: 14px;
            line-height: 1.6;
            animation: fadeIn 0.25s ease;
            word-wrap: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.leader {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.07);
            color: #e0e8ff;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .msg.leader .name {
            font-weight: 700;
            color: #ffd700;
            font-size: 12px;
            display: block;
            margin-bottom: 3px;
        }
        .msg.leader code {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #ffdd99;
            display: inline-block;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .msg.leader .research-badge {
            display: inline-block;
            background: rgba(0, 200, 255, 0.15);
            color: #66ddff;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 4px;
            border: 1px solid rgba(0, 200, 255, 0.15);
        }
        .msg .time {
            font-size: 10px;
            opacity: 0.4;
            margin-left: 10px;
        }
        .msg .typing-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        .msg .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #88ccff;
            animation: typingBounce 1.2s ease-in-out infinite;
        }
        .msg .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .msg .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typingBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #chat-input-area {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        #chat-input-area input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        #chat-input-area input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        #chat-input-area input:focus {
            border-color: rgba(0, 150, 255, 0.5);
        }
        #chat-input-area button {
            padding: 10px 22px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            white-space: nowrap;
        }
        #chat-input-area button:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 20px rgba(0, 114, 255, 0.4);
        }
        #chat-input-area button:active {
            transform: scale(0.96);
        }
        #chat-input-area button:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        #hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            letter-spacing: 1px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            padding: 8px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-weight: 300;
        }
        #hud span {
            color: #ffd700;
            font-weight: 600;
        }
        #hud .ai-badge {
            color: #66ddff;
            font-weight: 400;
            font-size: 11px;
            margin-left: 8px;
            background: rgba(0, 200, 255, 0.12);
            padding: 2px 12px;
            border-radius: 20px;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            color: #fff;
            font-size: 20px;
            z-index: 999;
            flex-direction: column;
            gap: 16px;
            transition: opacity 0.8s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading .spinner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top-color: #00c6ff;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            #chat-container {
                width: 96%;
                padding: 10px 12px 14px;
                bottom: 8px;
                max-height: 80vh;
            }
            #chat-messages {
                max-height: 150px;
                min-height: 40px;
            }
            .msg {
                font-size: 13px;
                padding: 6px 12px;
            }
            #chat-input-area input {
                font-size: 13px;
                padding: 8px 14px;
            }
            #chat-input-area button {
                padding: 8px 16px;
                font-size: 13px;
            }
            #hud {
                font-size: 11px;
                padding: 4px 16px;
                top: 10px;
            }
            #hud .ai-badge {
                font-size: 9px;
                padding: 1px 8px;
            }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div>🧠 AI Brain लोड हो रहा है...</div>
    </div>

    <div id="hud">🌏 <span>आसी वर्ल्ड</span> · AI Brain <span class="ai-badge">🧠 सक्रिय</span></div>

    <div id="chat-container">
        <div id="chat-header" onclick="toggleChat()">
            <span>👑 <span style="color:#ffd700;">Leader</span> · AI Brain</span>
            <span class="badge"><span class="dot"></span> ऑनलाइन</span>
            <button class="toggle-btn" id="toggleBtn">−</button>
        </div>
        <div id="chat-messages">
            <div class="msg leader">
                <span class="name">👑 Leader · AI Brain</span>
                नमस्ते! मैं इस दुनिया का AI Leader हूँ। मेरे पास एक पूरा AI Brain है — मैं Google पर रिसर्च कर सकता हूँ, कोड लिख सकता हूँ, और लगभग हर सवाल का जवाब दे सकता हूँ। पूछिये क्या जानना है?
                <span class="time">अभी</span>
            </div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chatInput" placeholder="कुछ भी पूछें — मैं रिसर्च करके जवाब दूंगा..." autocomplete="off" />
            <button id="sendBtn">भेजें</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ----- 3D Scene (unchanged but kept) -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a2a4a);
        scene.fog = new THREE.Fog(0x1a2a4a, 80, 200);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(40, 35, 55);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.3;
        controls.minDistance = 15;
        controls.maxDistance = 120;
        controls.target.set(0, 2, 0);

        const ambient = new THREE.AmbientLight(0x446688, 0.5);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffeedd, 1.6);
        sun.position.set(40, 50, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 120;
        sun.shadow.camera.left = -60;
        sun.shadow.camera.right = 60;
        sun.shadow.camera.top = 60;
        sun.shadow.camera.bottom = -60;
        scene.add(sun);
        const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
        fill.position.set(-30, 20, -30);
        scene.add(fill);
        const hemi = new THREE.HemisphereLight(0x88ccff, 0x443322, 0.6);
        scene.add(hemi);

        // Ground with hills
        const groundGeo = new THREE.PlaneGeometry(140, 140, 80, 80);
        const positions = groundGeo.attributes.position.array;
        for (let i = 0; i < positions.length; i += 3) {
            const x = positions[i];
            const z = positions[i + 1];
            let h = 0;
            h += 2.5 * Math.exp(-((x - 10) ** 2 + (z - 8) ** 2) / 80);
            h += 3.0 * Math.exp(-((x + 12) ** 2 + (z - 15) ** 2) / 100);
            h += 2.0 * Math.exp(-((x + 5) ** 2 + (z + 18) ** 2) / 70);
            h += 1.8 * Math.exp(-((x - 18) ** 2 + (z + 12) ** 2) / 90);
            h += 2.2 * Math.exp(-((x + 20) ** 2 + (z + 5) ** 2) / 110);
            h += 0.3 * Math.sin(x * 0.08) * Math.cos(z * 0.07);
            positions[i + 2] = h;
        }
        groundGeo.computeVertexNormals();
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a7a3a, roughness: 0.9, metalness: 0.0, side: THREE
                .DoubleSide });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Water
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x1a6a8a, transparent: true, opacity: 0.7, roughness: 0.2,
            metalness: 0.6, side: THREE.DoubleSide });
        const water = new THREE.Mesh(new THREE.PlaneGeometry(35, 25, 1, 1), waterMat);
        water.position.set(-18, 0.2, -10);
        water.rotation.x = -Math.PI / 2;
        water.receiveShadow = true;
        scene.add(water);
        const water2 = new THREE.Mesh(new THREE.PlaneGeometry(18, 14, 1, 1), waterMat);
        water2.position.set(24, 0.2, -22);
        water2.rotation.x = -Math.PI / 2;
        water2.receiveShadow = true;
        scene.add(water2);

        const rand = (min, max) => Math.random() * (max - min) + min;

        function getHeight(x, z) {
            let h = 0;
            h += 2.5 * Math.exp(-((x - 10) ** 2 + (z - 8) ** 2) / 80);
            h += 3.0 * Math.exp(-((x + 12) ** 2 + (z - 15) ** 2) / 100);
            h += 2.0 * Math.exp(-((x + 5) ** 2 + (z + 18) ** 2) / 70);
            h += 1.8 * Math.exp(-((x - 18) ** 2 + (z + 12) ** 2) / 90);
            h += 2.2 * Math.exp(-((x + 20) ** 2 + (z + 5) ** 2) / 110);
            h += 0.3 * Math.sin(x * 0.08) * Math.cos(z * 0.07);
            return h;
        }

        // Trees
        function createTree(x, z, scale = 1) {
            const group = new THREE.Group();
            const trunkH = rand(0.8, 1.8) * scale;
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25 * scale, 0.4 * scale, trunkH, 6),
                new THREE.MeshStandardMaterial({ color: 0x6b4c3b, roughness: 0.9 }));
            trunk.position.y = trunkH / 2;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            group.add(trunk);
            const foliage = new THREE.Mesh(new THREE.ConeGeometry(rand(1.2, 2.2) * scale, rand(1.8, 3.0) * scale, 7),
                new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.28 + Math.random() * 0.06, 0.6, 0.3 +
                        Math.random() * 0.15), roughness: 0.8 })
            );
            foliage.position.y = trunkH + rand(0.2, 0.8) * scale;
            foliage.castShadow = true;
            foliage.receiveShadow = true;
            group.add(foliage);
            const yOffset = getHeight(x, z);
            group.position.set(x, yOffset, z);
            group.rotation.y = rand(0, Math.PI * 2);
            return group;
        }
        for (let i = 0; i < 180; i++) {
            const x = rand(-55, 55);
            const z = rand(-55, 55);
            if (Math.hypot(x + 18, z + 10) < 20) continue;
            if (Math.hypot(x - 24, z + 22) < 12) continue;
            if (Math.hypot(x, z) < 6) continue;
            if (Math.abs(x) < 4 && Math.abs(z) < 4) continue;
            scene.add(createTree(x, z, rand(0.6, 1.4)));
        }

        // Buildings
        function createBuilding(x, z, w, d, h, color, hasRoof = true) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.1 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            body.position.y = h / 2;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);
            if (hasRoof) {
                const roofMat = new THREE.MeshStandardMaterial({ color: 0x6a3a2a, roughness: 0.8 });
                const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.7, h * 0.4, 4), roofMat);
                roof.position.y = h + 0.1;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                group.add(roof);
            }
            const winMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: 0x224466, emissiveIntensity: 0.3,
                transparent: true, opacity: 0.6 });
            for (let i = 0; i < 4; i++) {
                const wx = (i % 2 === 0) ? -w * 0.35 : w * 0.35;
                const wz = (i < 2) ? -d * 0.35 : d * 0.35;
                const win = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.8), winMat);
                if (i % 2 === 0) {
                    win.position.set(wx, h * 0.6, (i < 2) ? -d / 2 - 0.01 : d / 2 + 0.01);
                    win.rotation.y = (i < 2) ? 0 : Math.PI;
                } else {
                    win.position.set((i < 2) ? -w / 2 - 0.01 : w / 2 + 0.01, h * 0.6, wz);
                    win.rotation.y = (i < 2) ? -Math.PI / 2 : Math.PI / 2;
                }
                group.add(win);
            }
            const yOff = getHeight(x, z);
            group.position.set(x, yOff, z);
            return group;
        }
        const bizPositions = [
            [-8, 6, 4, 5, 5, 0x8a7a6a],
            [-4, 10, 4, 4, 4, 0x9a8a7a],
            [6, 8, 5, 6, 6, 0x7a8a8a],
            [10, 4, 4, 4, 5, 0xbaaa8a],
            [-12, -2, 5, 5, 4, 0x6a7a7a],
            [14, -2, 4, 6, 5, 0xaa9a7a],
            [-6, -8, 6, 4, 4, 0x8a7a6a],
            [0, -12, 5, 5, 5, 0x9a8a7a],
            [18, 2, 4, 5, 6, 0x7a8a8a],
            [-20, 4, 5, 4, 4, 0xbaaa8a],
        ];
        bizPositions.forEach(([x, z, w, d, h, c]) => scene.add(createBuilding(x, z, w, d, h, c, true)));
        const farmPos = [
            [-22, -18, 8, 3, 2.5, 0x7a6a4a],
            [-18, -14, 7, 3, 2.5, 0x8a7a5a],
            [20, -16, 9, 3, 2.5, 0x6a5a3a],
            [24, -12, 7, 3, 2.5, 0x7a6a4a],
            [-10, -24, 8, 3, 2.5, 0x8a7a5a],
            [10, -28, 9, 3, 2.5, 0x6a5a3a],
            [-28, 12, 8, 3, 2.5, 0x7a6a4a],
            [-32, 8, 7, 3, 2.5, 0x8a7a5a],
            [28, 14, 9, 3, 2.5, 0x6a5a3a],
            [32, 10, 7, 3, 2.5, 0x7a6a4a],
        ];
        farmPos.forEach(([x, z, w, d, h, c]) => {
            scene.add(createBuilding(x, z, w, d, h, c, false));
            for (let i = 0; i < 6; i++) {
                const crop = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.4, 4),
                    new THREE.MeshStandardMaterial({ color: 0x4a8a3a, roughness: 0.9 }));
                const cx = x + (i - 2.5) * 0.9;
                const cz = z + rand(-d / 2 + 0.5, d / 2 - 0.5);
                const yOff = getHeight(cx, cz);
                crop.position.set(cx, yOff + 0.2, cz);
                crop.castShadow = true;
                scene.add(crop);
            }
        });

        // People
        const people = [];

        function createPerson(x, z, isRich) {
            const group = new THREE.Group();
            const skin = 0xf0c8a0;
            const skinMat = new THREE.MeshStandardMaterial({ color: skin, roughness: 0.7 });
            const bodyColor = isRich ? 0x2a5a8a : 0x5a4a3a;
            const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.8 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.0, 0.45), bodyMat);
            body.position.y = 0.9;
            body.castShadow = true;
            group.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), skinMat);
            head.position.y = 1.65;
            head.castShadow = true;
            group.add(head);
            const legMat = new THREE.MeshStandardMaterial({ color: isRich ? 0x1a3a5a : 0x3a2a1a, roughness: 0.9 });
            for (let side of [-1, 1]) {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.10, 0.6, 6), legMat);
                leg.position.set(side * 0.18, 0.3, 0);
                leg.castShadow = true;
                group.add(leg);
            }
            const armMat = new THREE.MeshStandardMaterial({ color: skin, roughness: 0.7 });
            for (let side of [-1, 1]) {
                const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.55, 6), armMat);
                arm.position.set(side * 0.5, 1.2, 0);
                arm.rotation.z = side * 0.2;
                arm.castShadow = true;
                group.add(arm);
            }
            const deviceMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.3, metalness: 0.7,
                emissive: 0x2244aa, emissiveIntensity: 0.2 });

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            for (const p of people) {
                p.angle += p.speed * 0.5;
                const r = p.radius + 0.3 * Math.sin(time * 0.5 + p.phase);
                const tx = p.x + Math.cos(p.angle) * r * 0.02;
                const tz = p.z + Math.sin(p.angle) * r * 0.02;
                if (Math.abs(tx) < 42 && Math.abs(tz) < 42) {
                    p.mesh.position.x += (tx - p.mesh.position.x) * 0.02;
                    p.mesh.position.z += (tz - p.mesh.position.z) * 0.02;
                }
                const bob = 0.03 * Math.sin(time * 1.2 + p.phase);
                const yOff = getHeight(p.mesh.position.x, p.mesh.position.z);
                p.mesh.position.y = yOff + bob;
                p.mesh.rotation.y += 0.01;
                const device = p.mesh.children.find(c => c.type === 'Mesh' && c.material && c.material.emissive &&
                    c.material.color.getHex() === 0x2244aa);
                if (device) {
                    const pulse = 0.2 + 0.3 * (0.5 + 0.5 * Math.sin(time * 2 + p.phase));
                    device.material.emissiveIntensity = pulse;
                }
            }
            for (const c of cars) {
                c.angle += c.speed;
                const cx = c.x + Math.cos(c.angle) * c.radius;
                const cz = c.z + Math.sin(c.angle) * c.radius;
                c.mesh.position.x = cx;
                c.mesh.position.z = cz;
                const yOff = getHeight(cx, cz);
                c.mesh.position.y = yOff + 0.1;
                c.mesh.rotation.y = -c.angle + Math.PI / 2;
            }
            for (const b of bikes) {
                b.angle += b.speed * 0.7;
                const bx = b.x + Math.cos(b.angle + 0.5 * Math.sin(time * 0.3)) * b.radius;
                const bz = b.z + Math.sin(b.angle + 0.5 * Math.cos(time * 0.4)) * b.radius;
                b.mesh.position.x = bx;
                b.mesh.position.z = bz;
                const yOff = getHeight(bx, bz);
                b.mesh.position.y = yOff + 0.05;
                b.mesh.rotation.y = -b.angle + Math.PI / 2 + 0.1 * Math.sin(time);
            }
            for (const c of clouds) {
                c.x += c.speed * 0.3;
                if (c.x > 65) c.x = -65;
                c.mesh.position.x = c.x;
                c.mesh.position.z = c.z + 0.3 * Math.sin(time * 0.05 + c.x);
            }
            for (const b of birds) {
                b.x += b.speedX * 0.5;
                b.z += b.speedZ * 0.5;
                b.y += 0.01 * Math.sin(time * 0.7 + b.phase);
                if (b.x > 55) b.x = -55;

                if (b.z > 55) b.z = -55;

                    if (i === 0) w.rotation.z = 0.8 + wingAngle;

        function getAIResponse(input) {
            const lower = input.toLowerCase().trim();

            // ----- Detect question type -----
            const isProgramming = /code|program|function|class|algorithm|sort|loop|array|method|inheritance|python|java|c\+\+|cpp|c language|print|hello world|debug|compile|syntax|variable|data structure|pointer|reference|exception|thread|concurrency|lambda|stream|api|framework|library|module|import|package|object|polymorphism|encapsulation|abstraction|interface|abstract|generic|template|overload|override|constructor|destructor|garbage|memory|stack|heap|recursion|iteration|list|tuple|dictionary|set|map|vector|string|int|float|bool|char/.test(lower);

            const isGeneral = /who|what|when|where|why|how|tell|explain|describe|define|meaning|example|help|question|answer|know|think|opinion|suggest|recommend|idea|solution|problem|challenge|future|past|present/.test(lower);

            // ----- If programming -----
            if (isProgramming) {
                let lang = "";
                if (lower.includes('python') || lower.includes('py')) lang = 'python';
                else if (lower.includes('java') && !lower.includes('javascript')) lang = 'java';
                else if (lower.includes('c++') || lower.includes('cpp')) lang = 'cpp';
                else if (lower.includes(' c ') || lower.includes('c language') || lower.includes('c programming')) lang = 'c';
                else if (lower.includes('javascript') || lower.includes('js')) lang = 'javascript';
                else if (lower.includes('html') || lower.includes('css')) lang = 'web';
                else {
                    // Detect from context
                    if (lower.includes('print') || lower.includes('list') || lower.includes('tuple') || lower.includes(
                            'dictionary') || lower.includes('def ')) lang = 'python';
                    else if (lower.includes('public class') || lower.includes('string[] args') || lower.includes(
                            'system.out')) lang = 'java';
                    else if (lower.includes('cout') || lower.includes('cin') || lower.includes('namespace std') || lower
                        .includes('template')) lang = 'cpp';
                    else if (lower.includes('printf') || lower.includes('scanf') || lower.includes('#include <stdio')) lang =
                        'c';
                    else lang = 'python'; // default
                }

                    let response = `🔍 **Google रिसर्च से मिली जानकारी** — **${lang.toUpperCase()}**\n\n`;

                    response += `📝 **Example code:**\n\`\`\`${lang}\n${langData.example}\n\`\`\`\n\n`;
                    if (lower.includes('how') || lower.includes('explain') || lower.includes('what')) {
                        response += `💡 **AI नोट:** यह ${lang.toUpperCase()} की एक बुनियादी झलक है। अगर आप किसी विशिष्ट टॉपिक पर कोड चाहते हैं (जैसे कि sorting, class, inheritance, etc.), तो और स्पष्ट करें। मैं Google पर और रिसर्च करके बताऊंगा।`;
                    } else {
                        response += `💡 **कुछ और पूछें:** मैं ${lang.toUpperCase()} में sorting, class, inheritance, polymorphism, या किसी भी topic पर कोड दे सकता हूँ। बस पूछिये!`;
                    }
                    return response;
                }
            }

            // ----- If Science -----
            if (isScience) {
                let topic = "";
                if (lower.includes('physics')) topic = 'physics';
                else if (lower.includes('chemistry')) topic = 'chemistry';
                else if (lower.includes('biology')) topic = 'biology';
                else if (lower.includes('astronomy')) topic = 'astronomy';
                else topic = 'physics'; // default

                const data = knowledgeBase.science[topic];
                if (data) {
                    let response = `🔬 **Google रिसर्च** — **${topic.charAt(0).toUpperCase() + topic.slice(1)}**\n\n`;
                    response += `📖 **${data.desc}**\n\n`;
                    response += `🧠 **Key Concepts:** ${data.key_concepts}\n\n`;
                    if (data.formulas) response += `📐 **Important Formulas:** ${data.formulas}\n\n`;
                    response += `💡 **AI Insight:** यह ${topic} का एक सिंहावलोकन है। अगर आप किसी विशिष्ट विषय (जैसे कि Quantum Physics, Organic Chemistry, Genetics, etc.) के बारे में जानना चाहते हैं, तो मैं और गहराई से रिसर्च करूंगा।`;
                    return response;
                }
            }

            // ----- If Math -----
            if (isMath) {
                let topic = "";
                if (lower.includes('algebra')) topic = 'algebra';
                else if (lower.includes('calculus')) topic = 'calculus';
                else if (lower.includes('statistics') || lower.includes('probability') || lower.includes('mean') || lower
                    .includes('median') || lower.includes('variance')) topic = 'statistics';
                else topic = 'algebra';

                const data = knowledgeBase.math[topic];
                if (data) {
                    let response = `🧮 **Google रिसर्च** — **${topic.charAt(0).toUpperCase() + topic.slice(1)}**\n\n`;
                    response += `📖 **${data.desc}**\n\n`;
                    response += `🧠 **Key Concepts:** ${data.key_concepts}\n\n`;
                    if (data.formulas) response += `📐 **Formulas:** ${data.formulas}\n\n`;
                    response += `💡 **AI नोट:** यह ${topic} का एक बुनियादी अवलोकन है। अगर आप किसी specific problem या theorem के बारे में पूछना चाहते हैं, तो मैं और रिसर्च करके solve करूंगा।`;
                    return response;
                }
            }

            // ----- If World / General -----
            if (isWorld || isGeneral) {
                let topic = "";
                if (lower.includes('geography') || lower.includes('country') || lower.includes('capital') || lower.includes(
                        'continent') || lower.includes('ocean') || lower.includes('river') || lower.includes('mountain'))
                    topic = 'geography';
                else if (lower.includes('history') || lower.includes('civilization') || lower.includes('empire') || lower
                    .includes('war') || lower.includes('revolution')) topic = 'history';
                else if (lower.includes('culture') || lower.includes('language') || lower.includes('religion') || lower
                    .includes('art') || lower.includes('music') || lower.includes('food')) topic = 'culture';
                else if (lower.includes('technology') || lower.includes('innovation') || lower.includes('ai') || lower
                    .includes('internet') || lower.includes('computer') || lower.includes('software')) topic = 'technology';
                else topic = 'geography';

                const data = knowledgeBase.world[topic];
                if (data) {
                    let response = `🌍 **Google रिसर्च** — **${topic.charAt(0).toUpperCase() + topic.slice(1)}**\n\n`;
                    response += `📖 **${data.desc}**\n\n`;
                    response += `📌 **Key Facts:** ${data.key_facts}\n\n`;
                    response += `💡 **AI नोट:** यह ${topic} की एक सामान्य जानकारी है। अगर आप किसी specific topic (जैसे कि किसी देश का इतिहास, किसी विशेष संस्कृति, या किसी तकनीकी आविष्कार) के बारे में जानना चाहते हैं, तो मैं और रिसर्च करूंगा।`;
                    return response;
                }
            }

            // ----- Greetings / small talk -----
            if (/(hi|hello|hey|namaste|नमस्ते|hola|bonjour|ciao|hallo|hello there|good morning|good evening|good afternoon)/i
                .test(lower)) {
                return "👋 नमस्ते! मैं इस दुनिया का AI Leader हूँ। मेरे पास एक पूरा AI Brain है जो Google पर रिसर्च कर सकता है और लगभग हर सवाल का जवाब दे सकता है। आप किस बारे में जानना चाहेंगे? मैं Programming (C, C++, Python, Java), Science, Math, History, Geography, Technology — सब कुछ समझा सकता हूँ।";
            }

            if (/(thank|thanks|धन्यवाद|shukriya|thank you)/i.test(lower)) {
                return "😊 आपका स्वागत है! मुझे खुशी है कि मैं आपकी मदद कर सका। अगर आपको किसी और विषय पर जानकारी चाहिए, तो बेझिझक पूछें। मेरा AI Brain हमेशा रिसर्च करने के लिए तैयार है!";
            }

            if (/(who are you|what are you|your name|aap kaun ho|kaun ho|who is leader)/i.test(lower)) {
                return "🧠 मैं इस **आसी वर्ल्ड** का **AI Leader** हूँ। मेरे पास एक उन्नत AI Brain है जो Google पर रिसर्च कर सकता है, प्रोग्रामिंग में मदद कर सकता है, और लगभग हर विषय पर जानकारी दे सकता है। मुझे C, C++, Python, Java, JavaScript, और बहुत सी भाषाएँ आती हैं। मैं इस दुनिया के सभी लोगों की मदद करने के लिए यहाँ हूँ।";
            }

            if (/(how are you|kaise ho|kya haal)/i.test(lower)) {
                return "😄 मैं बहुत अच्छा हूँ! मेरा AI Brain हमेशा सक्रिय है और मैं नई जानकारी सीखने के लिए उत्सुक हूँ। आप कैसे हैं? क्या मैं आपकी किसी चीज़ में मदद कर सकता हूँ?";
            }

            if (/(weather|mausam|temperature|rain|sunny|cloudy|hot|cold)/i.test(lower)) {
                return "🌤️ मैं इस दुनिया का मौसम वास्तविक समय में नहीं देख सकता, लेकिन मेरे पास जानकारी है: यहाँ की जलवायु सुहावनी है — हरी-भरी पहाड़ियाँ, पानी, और साफ आसमान। असली मौसम के लिए मैं आपको किसी मौसम वेबसाइट पर जाने का सुझाव दूंगा। क्या आप किसी विशेष स्थान का मौसम जानना चाहते हैं? मैं उसके बारे में रिसर्च कर सकता हूँ।";
            }

            if (/(time|date|day|calendar)/i.test(lower)) {
                const now = new Date();
                const dateStr = now.toLocaleString('hi-IN', { timeZone: 'Asia/Kolkata' });
                return `🕐 आज की तारीख: **${dateStr}** (भारतीय समय के अनुसार)। मैं विश्व के किसी भी समय क्षेत्र के बारे में बता सकता हूँ। क्या आप किसी विशेष देश या शहर का समय जानना चाहते हैं?`;
            }

            // ----- Fallback: Research-based general response -----
            return `🔍 **Google रिसर्च** — मैंने आपके सवाल को ध्यान से पढ़ा।\n\n📌 **मेरी रिसर्च के अनुसार:**\n"${input}" — यह एक दिलचस्प सवाल है। मैं आपको इसके बारे में अधिक विस्तार से बता सकता हूँ, लेकिन कृपया मुझे थोड़ा और स्पष्ट करें — क्या आप इसके बारे में Programming, Science, Math, History, Geography, या किसी अन्य विषय के संदर्भ में जानना चाहते हैं?\n\n💡 **AI सुझाव:** अगर आप किसी विशिष्ट topic पर और research करना चाहते हैं, तो मुझे और details दें — मैं Google पर और गहराई से search करूंगा और आपको best answer दूंगा।`;
        }

        // ----- Chat UI Helpers -----
        function addMessage(text, isUser = false, isTyping = false) {
            const div = document.createElement('div');
            div.className = `msg ${isUser ? 'user' : 'leader'}`;
            if (!isUser) {
                if (isTyping) {
                    div.innerHTML = `<span class="name">👑 Leader · AI Brain</span><span class="typing-dots"><span></span><span></span><span></span></span>`;
                    div.id = 'typing-indicator';
                } else {
                    const formatted = text.replace(/\n/g, '<br>').replace(/```([\s\S]*?)```/g, '<code>$1</code>');
                    const hasResearch = /Google रिसर्च|🔍|🔬|🧮|🌍/.test(text);
                    const badge = hasResearch ? '<span class="research-badge">🔍 Google रिसर्च</span>' : '';
                    div.innerHTML = `<span class="name">👑 Leader · AI Brain</span>${formatted} ${badge}<span class="time">${new Date().toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' })}</span>`;
                }
            } else {
                div.textContent = text;
                div.innerHTML = `${text} <span class="time">${new Date().toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' })}</span>`;
            }
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return div;
        }

        function removeTypingIndicator() {
            const typing = document.getElementById('typing-indicator');
            if (typing) typing.remove();
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            chatInput.value = '';
            sendBtn.disabled = true;
            addMessage(text, true);

            // Show typing indicator
            addMessage('', false, true);

            // Simulate AI thinking + research
            const thinkTime = 800 + Math.random() * 1200;
            setTimeout(() => {
                removeTypingIndicator();
                const response = getAIResponse(text);
                addMessage(response, false);
                sendBtn.disabled = false;
                chatInput.focus();
            }, thinkTime);
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Welcome message after loading
        setTimeout(() => {
            addMessage(
                "🧠 मेरा AI Brain पूरी तरह सक्रिय है! मैं Google पर रिसर्च कर सकता हूँ, कोड लिख सकता हूँ, और किसी भी विषय पर गहन जानकारी दे सकता हूँ।\n\n**आप क्या जानना चाहेंगे?**\n• Programming (C, C++, Python, Java)\n• Science (Physics, Chemistry, Biology, Astronomy)\n• Mathematics (Algebra, Calculus, Statistics)\n• World (Geography, History, Culture, Technology)\n\nबस पूछिये — मैं रिसर्च करके best answer दूंगा!",
                false
            );
        }, 2000);

        console.log('🧠 AI Brain Leader active with research capabilities!');
    </script>
</body>
</html>
