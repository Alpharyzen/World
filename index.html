<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Self-Hosted AI Bot (No Keys)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 10px; }
        #chat { height: 350px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; background: #f5f5f5; margin-bottom: 10px; }
        .msg { margin: 8px 0; }
        .user { color: #0066cc; }
        .bot { color: #2e7d32; }
        .info { color: #555; font-size: 0.9em; }
        button, input { font-size: 1rem; padding: 8px; margin: 3px; }
        #model-status { background: #e8e8e8; padding: 6px; margin-bottom: 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>🧠 Local AI Bot (Memory + Wikipedia Download)</h2>
    <div id="model-status">Model load ho raha hai... (ye sirf pehli baar, ~800 MB)</div>
    <div id="chat"></div>
    <input type="text" id="userInput" placeholder="Message likhiye..." style="width:70%;" />
    <button onclick="sendMessage()">▶️ Bhejo</button>
    <button onclick="clearChat()">🧹 Chat Clear</button>
    <button onclick="clearMemory()">🗑️ Memory Clear</button>
    <hr>
    <h3>📥 Wikipedia se Memory Download</h3>
    <input type="text" id="learnQuery" placeholder="Kya search karna hai?" style="width:60%;" />
    <button onclick="learnFromWikipedia()">🔍 Download & Save</button>
    <div id="memoryInfo" class="info"></div>

    <script type="module">
        // ========== 1. WebLLM import (CDN se, no keys) ==========
        import * as webllm from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.46/lib/index.min.js";

        // ========== 2. Model select karein (chhota, effective) ==========
        const MODEL_ID = "TinyLlama-1.1B-Chat-v1.0-q4f16_1-MLC";  // alternative: "Llama-3.2-1B-Instruct-q4f16_1-MLC"
        
        // WebLLM engine banayein
        const engine = new webllm.MLCEngine();
        let isModelReady = false;
        const statusDiv = document.getElementById("model-status");

        async function initModel() {
            try {
                statusDiv.innerText = "⏳ Model load ho raha hai (ye sirf pehli baar)…";
                await engine.reload(MODEL_ID);
                isModelReady = true;
                statusDiv.innerText = "✅ Model ready! Ab aap baat kar sakte hain.";
            } catch (err) {
                statusDiv.innerText = "❌ Model load nahi hua. " + err.message;
                console.error(err);
            }
        }
        initModel();  // page load pe hi start

        // ========== 3. Memory system (localStorage) ==========
        const MEM_KEY = "local_ai_memory"; // array of {query, results, timestamp}

        function getMemory() {
            return JSON.parse(localStorage.getItem(MEM_KEY) || "[]");
        }
        function saveMemory(arr) {
            localStorage.setItem(MEM_KEY, JSON.stringify(arr));
            updateMemoryInfo();
        }
        function addMemoryItem(item) {
            const mem = getMemory();
            mem.push(item);
            if (mem.length > 30) mem.shift(); // max 30 searches
            saveMemory(mem);
        }
        function clearMemory() {
            localStorage.removeItem(MEM_KEY);
            updateMemoryInfo();
            appendMessage("System", "🧹 Memory saaf kar di gayi.");
        }
        function updateMemoryInfo() {
            const count = getMemory().length;
            document.getElementById("memoryInfo").innerText = `Memory mein ${count} downloaded knowledge items hain.`;
        }

        // ========== 4. Wikipedia se free search (no API key) ==========
        async function wikipediaSearch(query) {
            const url = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
            const res = await fetch(url);
            const data = await res.json();
            if (!data.query || !data.query.search) return [];
            return data.query.search.slice(0, 5).map(item => ({
                title: item.title,
                snippet: item.snippet.replace(/<\/?[^>]+(>|$)/g, ""), // strip HTML tags
                link: `https://en.wikipedia.org/wiki/${encodeURIComponent(item.title)}`
            }));
        }

        async function learnFromWikipedia() {
            const query = document.getElementById("learnQuery").value.trim();
            if (!query) return;
            appendMessage("System", `🔍 Wikipedia se "${query}" search kar raha hoon…`);
            try {
                const results = await wikipediaSearch(query);
                if (results.length === 0) {
                    appendMessage("Bot", "Koi Wikipedia results nahi mile.");
                    return;
                }
                // memory mein save karo
                const memoryItem = {
                    query,
                    results,
                    timestamp: new Date().toISOString()
                };
                addMemoryItem(memoryItem);
                // summary dikhao
                let summary = `✅ **Memory mein save ho gaya!** (${results.length} results)\n`;
                results.forEach((r,i) => {
                    summary += `${i+1}. **${r.title}** - ${r.snippet.substring(0,80)}...\n`;
                });
                appendMessage("Bot", summary);
                document.getElementById("learnQuery").value = "";
            } catch (e) {
                appendMessage("Bot", "❌ Wikipedia search fail. Network check karein.");
                console.error(e);
            }
        }

        // ========== 5. Memory retrieval (simple keyword match) ==========
        function retrieveMemoryContext(userMessage) {
            const memory = getMemory();
            if (memory.length === 0) return "";
            const words = userMessage.toLowerCase().split(/\s+/).filter(w => w.length > 2);
            let chunks = [];
            memory.forEach(item => {
                item.results.forEach(r => {
                    const text = (r.title + " " + r.snippet).toLowerCase();
                    let score = 0;
                    words.forEach(w => { if (text.includes(w)) score++; });
                    if (score > 0) chunks.push({score, text: `[Wikipedia] ${r.title}: ${r.snippet} (${r.link})`});
                });
            });
            chunks.sort((a,b) => b.score - a.score);
            const top = chunks.slice(0, 3).map(c => c.text).join("\n");
            return top ? "--- Relevant Memory ---\n" + top + "\n----------------------" : "";
        }

        // ========== 6. Chat history (localStorage) ==========
        const CHAT_KEY = "local_chat_history";
        function getChatHistory() {
            return JSON.parse(localStorage.getItem(CHAT_KEY) || "[]");
        }
        function saveChatHistory(msgs) {
            // sirf last 30 messages rakho
            if (msgs.length > 30) msgs = msgs.slice(-30);
            localStorage.setItem(CHAT_KEY, JSON.stringify(msgs));
        }
        function clearChat() {
            localStorage.removeItem(CHAT_KEY);
            document.getElementById("chat").innerHTML = "";
        }

        // ========== 7. UI helpers ==========
        window.appendMessage = function(sender, text) {
            const chatDiv = document.getElementById("chat");
            const div = document.createElement("div");
            div.className = `msg ${sender === "You" ? "user" : sender === "Bot" ? "bot" : "info"}`;
            div.innerHTML = `<strong>${sender}:</strong> ${text.replace(/\n/g, '<br>')}`;
            chatDiv.appendChild(div);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        };

        // ========== 8. Send message to AI (WebLLM) ==========
        window.sendMessage = async function() {
            if (!isModelReady) {
                appendMessage("System", "Model abhi ready nahi hai. Thoda wait karein...");
                return;
            }
            const input = document.getElementById("userInput");
            const userMsg = input.value.trim();
            if (!userMsg) return;
            appendMessage("You", userMsg);
            input.value = "";

            // Chat history update
            const chatHistory = getChatHistory();
            chatHistory.push({ role: "user", content: userMsg });

            // Build the messages array with memory context
            const memoryCtx = retrieveMemoryContext(userMsg);
            let systemPrompt = "You are a helpful, friendly assistant. Always try to answer in the user's language (Hindi or English). If provided with 'Relevant Memory', use that information to answer accurately and cite the source. If not, use your own knowledge.";
            const messages = [
                { role: "system", content: systemPrompt }
            ];
            if (memoryCtx) {
                messages.push({ role: "system", content: memoryCtx });
            }
            // last 6 messages from history
            const recent = chatHistory.slice(-6);
            messages.push(...recent);

            try {
                // Streaming response from WebLLM
                const replyParts = [];
                const completion = await engine.chat.completions.create({
                    messages: messages,
                    temperature: 0.7,
                    max_tokens: 300,
                    stream: true
                });

                // Create a placeholder bot message
                const botDiv = document.createElement("div");
                botDiv.className = "msg bot";
                const chatDiv = document.getElementById("chat");
                botDiv.innerHTML = "<strong>Bot:</strong> ";
                chatDiv.appendChild(botDiv);
                const botTextSpan = document.createElement("span");
                botDiv.appendChild(botTextSpan);

                // Process stream
                for await (const chunk of completion) {
                    const content = chunk.choices[0]?.delta?.content || "";
                    replyParts.push(content);
                    botTextSpan.innerText = replyParts.join("");
                    chatDiv.scrollTop = chatDiv.scrollHeight;
                }

                const fullReply = replyParts.join("");
                // Save to history
                chatHistory.push({ role: "assistant", content: fullReply });
                saveChatHistory(chatHistory);
            } catch (err) {
                appendMessage("Bot", "❌ Error generating reply: " + err.message);
                console.error(err);
            }
        };

        // ========== 9. Page load setup ==========
        window.addEventListener("DOMContentLoaded", () => {
            // Load existing chat
            const history = getChatHistory();
            history.forEach(msg => {
                appendMessage(msg.role === "user" ? "You" : "Bot", msg.content);
            });
            updateMemoryInfo();

            // Enter key handling
            document.getElementById("userInput").addEventListener("keypress", (e) => {
                if (e.key === "Enter") sendMessage();
            });
            document.getElementById("learnQuery").addEventListener("keypress", (e) => {
                if (e.key === "Enter") learnFromWikipedia();
            });
        });

        // Global functions for buttons
        window.clearChat = clearChat;
        window.clearMemory = clearMemory;
        window.learnFromWikipedia = learnFromWikipedia;
    </script>
</body>
</html>
