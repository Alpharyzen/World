<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuralPath</title>
  <!-- Chart.js for charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* === RESET & GLOBAL === */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #0A0E0D;
      color: #D7FFE8;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    textarea:focus,
    input:focus {
      outline: 2px solid #00FF9C;
      outline-offset: 2px;
    }
    button:focus-visible {
      outline: 2px solid #00FF9C;
      outline-offset: 2px;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #2A3A33;
      border-radius: 3px;
    }
    @keyframes blink {
      0%,
      50% {
        opacity: 1;
      }
      51%,
      100% {
        opacity: 0;
      }
    }

    /* === APP LAYOUT === */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* === STATUS BAR === */
    #statusBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid #1A2420;
      background: #0D1310;
      flex-shrink: 0;
    }
    #statusLeft {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px currentColor;
    }
    .dot.on {
      background: #00FF9C;
      color: #00FF9C;
    }
    .dot.off {
      background: #FF6B4A;
      color: #FF6B4A;
    }
    #statusText {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.05em;
      color: #6B8577;
    }
    #statusRight {
      display: flex;
      gap: 6px;
    }
    .iconBtn {
      background: transparent;
      border: 1px solid #2A3A33;
      color: #6B8577;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    .iconBtn:hover {
      background: #1A2420;
    }

    /* === CHAT AREA === */
    #chatArea {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* === EMPTY STATE === */
    #emptyState {
      margin: auto;
      text-align: center;
      max-width: 320px;
      color: #4A5C52;
    }
    #emptyGlyph {
      font-size: 32px;
      color: #00FF9C;
      margin-bottom: 12px;
    }
    #emptyTitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: #6B8577;
      margin-bottom: 8px;
    }
    #emptySub {
      font-size: 13px;
      line-height: 1.6;
    }

    /* === MESSAGE BUBBLES === */
    .userRow,
    .aiRow {
      display: flex;
    }
    .userRow {
      justify-content: flex-end;
    }
    .aiRow {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 12px;
    }
    .bubble.user {
      background: #16241C;
      border: 1px solid #234032;
      border-radius: 12px 12px 2px 12px;
    }
    .bubble.ai {
      background: #131715;
      border: 1px solid #1A2420;
      border-radius: 12px 12px 12px 2px;
    }
    .bubble.error {
      background: #1F1412;
      border: 1px solid #4A2A20;
      border-radius: 12px 12px 12px 2px;
    }

    .bubbleLabel {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #6B8577;
      margin-bottom: 5px;
      letter-spacing: 0.05em;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .tag {
      background: #1A2420;
      color: #00FF9C;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .bubbleText {
      font-size: 14.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      color: #D7FFE8;
    }

    /* === CODE BLOCK === */
    .codeWrap {
      margin-top: 8px;
      margin-bottom: 8px;
      background: #0D1310;
      border: 1px solid #1A2420;
      border-radius: 8px;
      overflow: hidden;
    }
    .codeTopComment,
    .codeBottomComment {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: #4A5C52;
      padding: 8px 12px 0 12px;
    }
    .codeBottomComment {
      padding: 0 12px 8px 12px;
    }
    .codeHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
    }
    .codeLang {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: #00FF9C;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .codeActions {
      display: flex;
      gap: 6px;
    }
    .codeActionBtn {
      background: #1A2420;
      border: 1px solid #2A3A33;
      color: #D7FFE8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 5px;
      cursor: pointer;
      letter-spacing: 0.03em;
    }
    .codeActionBtn:hover {
      background: #2A3A33;
    }
    .codeBlock {
      margin: 0;
      padding: 10px 12px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 1.6;
      color: #D7FFE8;
      background: #0A0E0D;
    }
    .previewFrame {
      width: 100%;
      height: 320px;
      border: 1px solid #1A2420;
      border-top: 2px solid #00FF9C;
      background: #fff;
    }

    /* === CHART === */
    .chartWrap {
      margin-top: 10px;
      padding: 10px;
      background: #0D1310;
      border: 1px solid #1A2420;
      border-radius: 8px;
      position: relative;
      height: 220px;
    }
    .chartWrap canvas {
      width: 100% !important;
      height: 100% !important;
    }
    .chartTitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #6B8577;
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }

    /* === IMAGE === */
    .imageWrap {
      margin-top: 8px;
      margin-bottom: 8px;
      background: #0D1310;
      border: 1px solid #1A2420;
      border-radius: 8px;
      overflow: hidden;
      padding: 8px 12px 12px 12px;
    }
    .imageLoading {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: #00FF9C;
      padding: 20px 0;
      text-align: center;
    }
    .generatedImage {
      width: 100%;
      border-radius: 6px;
      margin-top: 4px;
    }
    .imageOpenLink {
      display: inline-block;
      margin-top: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: #6B8577;
      text-decoration: none;
    }
    .imageOpenLink:hover {
      color: #D7FFE8;
    }

    /* === TERMINAL LOG === */
    .terminalLog {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: #00FF9C;
      line-height: 1.8;
    }
    .logLine {
      opacity: 0.85;
    }
    .cursorBlink {
      animation: blink 1s step-start infinite;
      color: #00FF9C;
    }

    /* === INPUT BAR === */
    #inputBar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #1A2420;
      background: #0D1310;
      flex-shrink: 0;
    }
    #inputBar textarea {
      flex: 1;
      background: #131715;
      border: 1px solid #2A3A33;
      border-radius: 10px;
      color: #D7FFE8;
      padding: 10px 12px;
      font-size: 14.5px;
      font-family: 'Inter', sans-serif;
      resize: none;
      max-height: 100px;
    }
    #sendBtn {
      background: #00FF9C;
      color: #0A0E0D;
      border: none;
      border-radius: 10px;
      width: 44px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #sendBtn:hover:not(:disabled) {
      background: #66FFB3;
    }
    #sendBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* === MODAL === */
    #modalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    #modalOverlay.hidden {
      display: none;
    }
    .modal {
      background: #131715;
      border: 1px solid #2A3A33;
      border-radius: 14px;
      padding: 22px;
      max-width: 380px;
      width: 100%;
    }
    .modalTitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      color: #D7FFE8;
      margin-bottom: 8px;
    }
    .modalSub {
      font-size: 12.5px;
      color: #6B8577;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .modalInput {
      width: 100%;
      background: #0A0E0D;
      border: 1px solid #2A3A33;
      border-radius: 8px;
      color: #D7FFE8;
      padding: 10px 12px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .modalActions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .modalCancelBtn {
      background: transparent;
      border: 1px solid #2A3A33;
      color: #6B8577;
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      font-size: 13px;
    }
    .modalCancelBtn:hover {
      background: #1A2420;
    }
    .modalSaveBtn {
      background: #00FF9C;
      color: #0A0E0D;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .modalSaveBtn:hover {
      background: #66FFB3;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Status Bar -->
    <div id="statusBar">
      <div id="statusLeft">
        <span id="statusDot" class="dot off"></span>
        <span id="statusText">NEURALPATH // NO KEY</span>
      </div>
      <div id="statusRight">
        <button class="iconBtn" id="keyBtn">KEY</button>
        <button class="iconBtn" id="wipeBtn">WIPE</button>
      </div>
    </div>

    <!-- Chat Area -->
    <div id="chatArea">
      <!-- Empty state will be shown when messages.length === 0 -->
      <div id="emptyState">
        <div id="emptyGlyph">◈</div>
        <div id="emptyTitle">Memory empty.</div>
        <div id="emptySub">Kuch bhi pucho — web search aur Wikipedia se grounded jawab milega. Sab kuch yahin save rahega, refresh ke baad bhi.</div>
      </div>
      <!-- Messages will be rendered here -->
    </div>

    <!-- Input Bar -->
    <div id="inputBar">
      <textarea id="msgInput" rows="1" placeholder="Apna sawaal type karo..."></textarea>
      <button id="sendBtn" disabled>→</button>
    </div>

    <!-- Modal -->
    <div id="modalOverlay" class="hidden">
      <div class="modal">
        <div class="modalTitle">Connect Claude API key</div>
        <div class="modalSub">Yeh key sirf tumhare browser mein local store hoti hai. Anthropic console se free key milti hai: console.anthropic.com</div>
        <input class="modalInput" id="keyInput" type="password" placeholder="sk-ant-..." />
        <div class="modalActions">
          <button class="modalCancelBtn" id="modalCancel">Cancel</button>
          <button class="modalSaveBtn" id="modalSave">Save & Connect</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    //  STORAGE HELPERS
    // ============================================================
    const STORAGE_KEY = "neuralpath:chat-history";
    const STORAGE_KEY_KEYNAME = "neuralpath:api-key";

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return [];
    }

    function saveHistory(messages) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
      } catch (e) {
        console.error("Storage save failed", e);
      }
    }

    function loadApiKey() {
      try {
        return localStorage.getItem(STORAGE_KEY_KEYNAME) || "";
      } catch (e) {
        return "";
      }
    }

    function saveApiKey(key) {
      try {
        localStorage.setItem(STORAGE_KEY_KEYNAME, key);
      } catch (e) {
        console.error("Key save failed", e);
      }
    }

    // ============================================================
    //  WIKIPEDIA FETCH
    // ============================================================
    async function fetchWikipedia(query) {
      try {
        const searchUrl =
          `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=1`;
        const searchRes = await fetch(searchUrl);
        const searchData = await searchRes.json();
        const title = searchData?.query?.search?.[0]?.title;
        if (!title) return null;

        const extractUrl =
          `https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=true&explaintext=true&titles=${encodeURIComponent(title)}&format=json&origin=*`;
        const extractRes = await fetch(extractUrl);
        const extractData = await extractRes.json();
        const pages = extractData?.query?.pages;
        const pageId = pages ? Object.keys(pages)[0] : null;
        const extract = pageId ? pages[pageId]?.extract : null;
        return extract ? { title, extract: extract.slice(0, 1200) } : null;
      } catch (e) {
        return null;
      }
    }

    // ============================================================
    //  CODE SANDBOX
    // ============================================================
    function runSandboxedCode(code) {
      const logs = [];
      const fakeConsole = {
        log: (...args) => logs.push(args.map(stringifyArg).join(" ")),
      };
      try {
        const fn = new Function("console", `"use strict";\n${code}`);
        const result = fn(fakeConsole);
        return { ok: true, logs, result: result !== undefined ? stringifyArg(result) : null };
      } catch (e) {
        return { ok: false, logs, error: e.message };
      }
    }

    function stringifyArg(arg) {
      if (typeof arg === "object") {
        try {
          return JSON.stringify(arg, null, 2);
        } catch {
          return String(arg);
        }
      }
      return String(arg);
    }

    function tryExtractChart(line) {
      try {
        const parsed = JSON.parse(line);
        if (parsed && parsed.chart && parsed.chart.labels && parsed.chart.values) {
          return parsed.chart;
        }
      } catch (e) {}
      return null;
    }

    // ============================================================
    //  IMAGE GENERATION (Pollinations)
    // ============================================================
    function buildImageUrl(prompt, seed) {
      const cleaned = encodeURIComponent(prompt.trim());
      const s = seed || Math.floor(Math.random() * 1000000);
      return `https://image.pollinations.ai/prompt/${cleaned}?width=768&height=768&seed=${s}&nologo=true`;
    }

    // ============================================================
    //  MESSAGE PARSING
    // ============================================================
    function parseMessageParts(text) {
      const parts = [];
      const fenceRegex = /```(\w+)?\n([\s\S]*?)```/g;
      let lastIndex = 0;
      let match;
      while ((match = fenceRegex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          const prose = text.slice(lastIndex, match.index).trim();
          if (prose) parts.push({ type: "prose", text: prose });
        }
        parts.push({
          type: "code",
          lang: (match[1] || "text").toLowerCase(),
          code: match[2].trimEnd(),
        });
        lastIndex = match.index + match[0].length;
      }
      const rest = text.slice(lastIndex).trim();
      if (rest) parts.push({ type: "prose", text: rest });
      if (parts.length === 0) parts.push({ type: "prose", text });
      return parts;
    }

    // ============================================================
    //  DOM REFS & STATE
    // ============================================================
    const chatArea = document.getElementById('chatArea');
    const emptyState = document.getElementById('emptyState');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const keyBtn = document.getElementById('keyBtn');
    const wipeBtn = document.getElementById('wipeBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const keyInput = document.getElementById('keyInput');
    const modalCancel = document.getElementById('modalCancel');
    const modalSave = document.getElementById('modalSave');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    let messages = [];
    let loading = false;
    let processLog = [];
    let apiKey = '';
    let chartInstances = {}; // to destroy old charts

    // ============================================================
    //  RENDER FUNCTION
    // ============================================================
    function render() {
      // Update status
      const hasKey = !!apiKey;
      statusDot.className = 'dot ' + (hasKey ? 'on' : 'off');
      statusText.textContent = `NEURALPATH // ${hasKey ? 'LINKED' : 'NO KEY'}`;

      // Build chat HTML
      let html = '';
      if (messages.length === 0) {
        html = `<div id="emptyState">
                <div id="emptyGlyph">◈</div>
                <div id="emptyTitle">Memory empty.</div>
                <div id="emptySub">Kuch bhi pucho — web search aur Wikipedia se grounded jawab milega. Sab kuch yahin save rahega, refresh ke baad bhi.</div>
              </div>`;
      } else {
        for (let i = 0; i < messages.length; i++) {
          const m = messages[i];
          const isUser = m.role === 'user';
          const isError = m.isError || false;
          const bubbleClass = isUser ? 'user' : (isError ? 'error' : 'ai');
          const rowClass = isUser ? 'userRow' : 'aiRow';

          let tagsHtml = '';
          if (m.usedWiki) tagsHtml += '<span class="tag">WIKI</span>';
          if (m.usedSearch) tagsHtml += '<span class="tag">WEB</span>';
          if (m.usedCode) tagsHtml += '<span class="tag">CODE</span>';
          if (m.usedImage) tagsHtml += '<span class="tag">IMG</span>';

          let contentHtml = '';
          if (isUser) {
            contentHtml = `<div class="bubbleText">${escapeHtml(m.content)}</div>`;
          } else {
            // Parse parts
            const parts = parseMessageParts(m.content);
            for (const p of parts) {
              if (p.type === 'prose') {
                contentHtml += `<div class="bubbleText">${escapeHtml(p.text)}</div>`;
              } else {
                // code block
                const isRunnable = ['html', 'htm'].includes(p.lang);
                const codeId = `code-${i}-${Math.random().toString(36).substr(2, 6)}`;
                contentHtml += `
                  <div class="codeWrap" data-codeid="${codeId}">
                    <div class="codeTopComment">// ${p.lang} — ${p.code.split('\n').length} lines</div>
                    <div class="codeHeader">
                      <span class="codeLang">${p.lang}</span>
                      <div class="codeActions">
                        ${isRunnable ? `<button class="codeActionBtn runBtn" data-codeid="${codeId}">▶ RUN</button>` : ''}
                        <button class="codeActionBtn copyBtn" data-code="${escapeHtml(p.code)}">COPY</button>
                      </div>
                    </div>
                    <pre class="codeBlock"><code>${escapeHtml(p.code)}</code></pre>
                    <div class="codeBottomComment">// end ${p.lang} block</div>
                    ${isRunnable ? `<div class="previewFrame" id="preview-${codeId}" style="display:none;"></div>` : ''}
                  </div>
                `;
              }
            }
          }

          // Chart
          let chartHtml = '';
          if (m.chart) {
            const chartId = `chart-${i}-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`;
            chartHtml = `
              <div class="chartWrap" id="${chartId}">
                ${m.chart.title ? `<div class="chartTitle">${escapeHtml(m.chart.title)}</div>` : ''}
                <canvas></canvas>
              </div>
            `;
          }

          // Image
          let imageHtml = '';
          if (m.image) {
            imageHtml = `
              <div class="imageWrap">
                <div class="codeTopComment">// image — "${escapeHtml(m.image.prompt)}"</div>
                <div class="imageLoading" style="display:block;">[generating image...]</div>
                <img class="generatedImage" src="${escapeHtml(m.image.url)}" alt="${escapeHtml(m.image.prompt)}" style="display:none;" onload="this.previousElementSibling.style.display='none'; this.style.display='block';" onerror="this.previousElementSibling.textContent='[image generation failed]'; this.style.display='none';" />
                <a href="${escapeHtml(m.image.url)}" target="_blank" rel="noreferrer" class="imageOpenLink">open full size ↗</a>
              </div>
            `;
          }

          html += `
            <div class="${rowClass}">
              <div class="bubble ${bubbleClass}">
                <div class="bubbleLabel">
                  ${isUser ? 'YOU' : 'NEURALPATH'}
                  ${tagsHtml}
                </div>
                ${contentHtml}
                ${chartHtml}
                ${imageHtml}
              </div>
            </div>
          `;
        }
      }

      // Loading indicator
      if (loading) {
        let logHtml = '';
        for (const line of processLog) {
          logHtml += `<div class="logLine">${escapeHtml(line)}</div>`;
        }
        html += `
          <div class="aiRow">
            <div class="bubble ai">
              <div class="bubbleLabel">NEURALPATH</div>
              <div class="terminalLog">
                ${logHtml}
                <div class="cursorBlink">▋</div>
              </div>
            </div>
          </div>
        `;
      }

      chatArea.innerHTML = html;

      // Re-bind copy buttons
      document.querySelectorAll('.copyBtn').forEach(btn => {
        btn.addEventListener('click', function() {
          const code = this.dataset.code;
          navigator.clipboard.writeText(code).then(() => {
            const orig = this.textContent;
            this.textContent = '✓ COPIED';
            setTimeout(() => { this.textContent = orig; }, 1500);
          }).catch(() => {});
        });
      });

      // Re-bind run buttons
      document.querySelectorAll('.runBtn').forEach(btn => {
        btn.addEventListener('click', function() {
          const codeId = this.dataset.codeid;
          const wrap = document.querySelector(`.codeWrap[data-codeid="${codeId}"]`);
          const pre = wrap.querySelector('.codeBlock code');
          const code = pre.textContent;
          const previewFrame = document.getElementById(`preview-${codeId}`);
          if (previewFrame) {
            if (previewFrame.style.display === 'none') {
              previewFrame.style.display = 'block';
              previewFrame.srcdoc = code;
              this.textContent = 'HIDE';
            } else {
              previewFrame.style.display = 'none';
              this.textContent = '▶ RUN';
            }
          }
        });
      });

      // Render charts after DOM update
      // We need to wait a tick for canvas to be in DOM
      setTimeout(() => {
        // Destroy old chart instances
        for (const key in chartInstances) {
          try { chartInstances[key].destroy(); } catch (e) {}
        }
        chartInstances = {};

        // Find chart wrappers and render
        document.querySelectorAll('.chartWrap').forEach(wrapper => {
          const canvas = wrapper.querySelector('canvas');
          if (!canvas) return;
          const chartData = messages.find((m, idx) => {
            // crude: we attached chart to message, but we need to match index
            // we can get the wrapper id and extract index
            const id = wrapper.id;
            const parts = id.split('-');
            const msgIdx = parseInt(parts[1]);
            return messages[msgIdx] && messages[msgIdx].chart;
          });
          if (!chartData) return;
          const chart = chartData.chart;
          const data = chart.labels.map((label, i) => ({
            label,
            value: chart.values[i],
          }));
          const isLine = chart.type === 'line';
          const ctx = canvas.getContext('2d');
          const instance = new Chart(ctx, {
            type: isLine ? 'line' : 'bar',
            data: {
              labels: data.map(d => d.label),
              datasets: [{
                label: chart.title || 'Value',
                data: data.map(d => d.value),
                borderColor: '#00FF9C',
                backgroundColor: isLine ? 'transparent' : '#00FF9C',
                borderWidth: 2,
                pointBackgroundColor: '#00FF9C',
                pointRadius: 3,
                tension: 0.2,
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: '#131715',
                  borderColor: '#2A3A33',
                  borderWidth: 1,
                  titleColor: '#D7FFE8',
                  bodyColor: '#D7FFE8',
                }
              },
              scales: {
                x: {
                  ticks: { color: '#6B8577', font: { size: 11 } },
                  grid: { color: '#1A2420' }
                },
                y: {
                  ticks: { color: '#6B8577', font: { size: 11 } },
                  grid: { color: '#1A2420' }
                }
              }
            }
          });
          chartInstances[wrapper.id] = instance;
        });
      }, 50);

      // Scroll to bottom
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // ============================================================
    //  UTILITY: escape HTML
    // ============================================================
    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // ============================================================
    //  SEND MESSAGE LOGIC (main loop)
    // ============================================================
    async function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || loading) return;
      if (!apiKey) {
        modalOverlay.classList.remove('hidden');
        return;
      }

      const userMsg = { role: 'user', content: text, ts: Date.now() };
      messages.push(userMsg);
      saveHistory(messages);
      msgInput.value = '';
      sendBtn.disabled = true;
      loading = true;
      processLog = [];
      render();

      try {
        processLog.push('[wikipedia] checking relevance...');
        const wiki = await fetchWikipedia(text);
        if (wiki) {
          processLog.push(`[wikipedia] found: ${wiki.title}`);
        } else {
          processLog.push('[wikipedia] no direct match');
        }
        render();

        const systemPrompt = `You are NeuralPath, a helpful AI assistant. Respond in the same language register the user uses (Hinglish, Hindi, or English) matching their style. Be direct and useful.

  CODE OUTPUT RULES (critical):
  - Whenever you write any code — HTML, CSS, JS, Python, anything — always wrap it in a fenced code block with the language name, like \`\`\`html ... \`\`\` or \`\`\`python ... \`\`\`. Never write code inline in plain prose.
  - If the user asks you to "build a website" or "build a page", give one single complete, self-contained \`\`\`html block with all CSS and JS inside it (inline <style> and <script>), so it can run standalone in a browser. Don't split it into separate files or separate code blocks unless asked.
  - Keep a short prose sentence before the code block explaining what it does, and a short sentence after if there's anything the user should know (e.g. how to use it). Don't repeat the whole code in prose.

  You have an execute_js tool: a real JavaScript sandbox that actually runs in the user's browser. Use it for any math, calculation, data processing, simulation, or when the user wants a chart/graph. Use console.log() to print results inside the code. For charts, after computing the data, console.log a JSON object of this exact shape so it can be rendered: {"chart": {"type": "bar"|"line", "title": "...", "labels": [...], "values": [...]}}.
  If execute_js returns an error, read the error message and immediately try again with corrected code — don't just report the error to the user, fix it yourself unless you try 3 times and still fail, in which case explain what's blocking it.

  You have a generate_image tool. Use it whenever the user asks for an image, photo, illustration, artwork, logo, or any visual to be created (not for real photos of real people/places — for those, suggest a web image search instead). Write a clear, descriptive prompt in English for best results even if the user asked in Hindi/Hinglish.

  If Wikipedia context is provided below, use it to ground factual answers, but verify/supplement with your own knowledge and web search.

  ${wiki ? `WIKIPEDIA CONTEXT (title: ${wiki.title}):\n${wiki.extract}` : ''}`;

        let apiMessages = messages.slice(-12).map(m => ({ role: m.role, content: m.content }));

        const tools = [
          { type: 'web_search_20250305', name: 'web_search' },
          {
            name: 'execute_js',
            description: 'Execute JavaScript code in a sandbox and return console.log output and the return value. Use for math, data processing, simulations, or generating chart data.',
            input_schema: {
              type: 'object',
              properties: {
                code: { type: 'string', description: 'JavaScript code to run.' }
              },
              required: ['code']
            }
          },
          {
            name: 'generate_image',
            description: 'Generate an image from a text prompt. Returns a URL to the generated image.',
            input_schema: {
              type: 'object',
              properties: {
                prompt: { type: 'string', description: 'Descriptive English prompt for the image to generate.' }
              },
              required: ['prompt']
            }
          }
        ];

        let usedSearch = false;
        let usedCode = false;
        let usedImage = false;
        let chartData = null;
        let imageData = null;
        let finalTextParts = [];
        let loopGuard = 0;

        while (loopGuard < 8) {
          loopGuard++;
          processLog.push(loopGuard === 1 ? '[claude] connecting to model...' : '[claude] continuing...');
          render();

          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01'
            },
            body: JSON.stringify({
              model: 'claude-sonnet-4-6',
              max_tokens: 2000,
              system: systemPrompt,
              messages: apiMessages,
              tools
            })
          });

          if (!response.ok) {
            const errText = await response.text();
            throw new Error(`API error ${response.status}: ${errText.slice(0, 200)}`);
          }

          const data = await response.json();
          const content = data.content || [];

          const textBlocks = content.filter(b => b.type === 'text');
          finalTextParts = textBlocks.map(b => b.text);

          // web_search (server tool) – we just note it
          const serverToolUse = content.find(b => b.type === 'server_tool_use' && b.name === 'web_search');
          if (serverToolUse) {
            usedSearch = true;
            processLog.push('[web_search] query executed');
            // We don't add a tool_result; the API handles it server-side.
            // Continue loop to allow further tool calls.
            continue;
          }

          const jsCall = content.find(b => b.type === 'tool_use' && b.name === 'execute_js');
          const imgCall = content.find(b => b.type === 'tool_use' && b.name === 'generate_image');

          if (jsCall) {
            usedCode = true;
            processLog.push('[execute_js] running code...');
            render();
            const codeStr = jsCall.input?.code || '';
            const result = runSandboxedCode(codeStr);

            if (result.ok) {
              processLog.push('[execute_js] success');
              for (const line of result.logs) {
                const parsed = tryExtractChart(line);
                if (parsed) chartData = parsed;
              }
            } else {
              processLog.push(`[execute_js] error — asking model to self-fix`);
            }
            render();

            // Add assistant message with tool use and tool result
            apiMessages.push({ role: 'assistant', content });
            apiMessages.push({
              role: 'user',
              content: [{
                type: 'tool_result',
                tool_use_id: jsCall.id,
                content: result.ok ?
                  `Output:\n${result.logs.join('\n') || '(no console output)'}\n${result.result ? `Return value: ${result.result}` : ''}` :
                  `Error: ${result.error}\n\nFix the code and call execute_js again with corrected code. Do not just explain the error.`,
                is_error: !result.ok
              }]
            });
            continue;
          }

          if (imgCall) {
            usedImage = true;
            const prompt = imgCall.input?.prompt || text;
            processLog.push(`[generate_image] "${prompt.slice(0, 40)}..."`);
            const url = buildImageUrl(prompt);
            imageData = { prompt, url };
            render();

            apiMessages.push({ role: 'assistant', content });
            apiMessages.push({
              role: 'user',
              content: [{
                type: 'tool_result',
                tool_use_id: imgCall.id,
                content: `Image generated successfully and will be shown to the user automatically. Just confirm briefly in your own words — don't repeat the URL.`
              }]
            });
            continue;
          }

          processLog.push('[claude] response ready');
          break;
        }

        const replyText = finalTextParts.join('\n').trim() || '(no text response)';

        const assistantMsg = {
          role: 'assistant',
          content: replyText,
          ts: Date.now(),
          usedWiki: !!wiki,
          usedSearch,
          usedCode,
          usedImage,
          chart: chartData,
          image: imageData
        };
        messages.push(assistantMsg);
        saveHistory(messages);
        processLog = [];
        loading = false;
        render();
        sendBtn.disabled = false;
        msgInput.focus();

      } catch (err) {
        processLog.push(`[error] ${err.message}`);
        const errorMsg = {
          role: 'assistant',
          content: `Connection error: ${err.message}\n\nCheck your API key or network, then try again.`,
          ts: Date.now(),
          isError: true
        };
        messages.push(errorMsg);
        saveHistory(messages);
        loading = false;
        render();
        sendBtn.disabled = false;
      }
    }

    // ============================================================
    //  EVENT BINDINGS
    // ============================================================
    // Send on Enter (Shift+Enter for newline)
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    // Key button
    keyBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('hidden');
      keyInput.value = '';
      keyInput.focus();
    });

    // Wipe button
    wipeBtn.addEventListener('click', () => {
      if (confirm('Clear all chat history?')) {
        messages = [];
        saveHistory([]);
        render();
      }
    });

    // Modal
    modalCancel.addEventListener('click', () => {
      modalOverlay.classList.add('hidden');
    });

    modalSave.addEventListener('click', async () => {
      const key = keyInput.value.trim();
      if (!key) return;
      await saveApiKey(key);
      apiKey = key;
      modalOverlay.classList.add('hidden');
      render();
      // If there was a pending send, it will now work
    });

    // Close modal on overlay click
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.add('hidden');
      }
    });

    // ============================================================
    //  INIT
    // ============================================================
    (async function init() {
      const hist = loadHistory();
      const key = loadApiKey();
      messages = hist;
      apiKey = key;
      if (!apiKey) {
        modalOverlay.classList.remove('hidden');
      }
      render();
      // if we have messages, scroll to bottom
      chatArea.scrollTop = chatArea.scrollHeight;
      // update send button state
      msgInput.addEventListener('input', () => {
        sendBtn.disabled = !msgInput.value.trim() || loading;
      });
      sendBtn.disabled = true;
    })();
  </script>
</body>
