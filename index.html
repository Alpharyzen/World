<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Bot with Memory & Google Download</title>
<style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
    #chat { height: 400px; overflow-y: auto; border:1px solid #ccc; padding:10px; margin-bottom:10px; background:#f9f9f9; }
    .msg { margin:8px 0; }
    .user { color: #0066cc; }
    .bot { color: #008000; }
    input[type="text"] { width: 75%; padding:8px; }
    button { padding:8px 15px; margin:2px; }
    #learnQuery { width: 60%; }
    .memory-count { font-size:0.8em; color:gray; margin-top:5px; }
</style>
</head>
<body>
<h2>🤖 Mera AI Bot (Memory + Google)</h2>
<p>⚙️ API keys ko code mein set karein (OPENAI_API_KEY, GOOGLE_CSE_KEY, GOOGLE_CSE_CX) – <strong>ye demo hai, key frontend mein expose hoti hai!</strong></p>

<div id="chat"></div>
<input type="text" id="userInput" placeholder="Message likhiye..." />
<button onclick="sendMessage()">Bhejo</button>
<button onclick="clearChat()">Chat Clear</button>
<button onclick="clearMemory()">Memory Clear</button>

<hr>
<h3>📥 Google Search se Memory Download karein</h3>
<input type="text" id="learnQuery" placeholder="Search query..." />
<button onclick="learnFromGoogle()">Download & Save</button>
<div id="memoryInfo" class="memory-count"></div>

<script>
// ========== CONFIG: APNI KEYS YAHAN DALO ==========
const OPENAI_API_KEY = 'sk-...';   // 👈 apni OpenAI key
const GOOGLE_CSE_KEY = 'AIza...'; // 👈 apni Google Custom Search API key
const GOOGLE_CSE_CX = 'YOUR_SEARCH_ENGINE_ID'; // 👈 apna Custom Search Engine ID
// ==================================================

// Agar Google CSE nahi hai, to Wikipedia fallback option (free, no key)
const USE_WIKIPEDIA_FALLBACK = false; // true karein to Google ki jagah Wikipedia use hogi

// --- Memory store (localStorage) ---
const MEMORY_KEY = 'bot_memory_items';  // array of { query, results, timestamp }

function getMemory() {
    const data = localStorage.getItem(MEMORY_KEY);
    return data ? JSON.parse(data) : [];
}

function saveMemory(memoryArray) {
    localStorage.setItem(MEMORY_KEY, JSON.stringify(memoryArray));
    updateMemoryCount();
}

function addMemoryItem(item) {
    const memory = getMemory();
    memory.push(item);
    // max 50 items rakhein, purana hata dein
    if (memory.length > 50) memory.shift();
    saveMemory(memory);
}

function clearMemory() {
    localStorage.removeItem(MEMORY_KEY);
    updateMemoryCount();
    appendMessage('System', '🧹 Saari downloaded memory clear kar di gayi.');
}

function updateMemoryCount() {
    const count = getMemory().length;
    document.getElementById('memoryInfo').innerText = `Memory mein ${count} search results saved hain.`;
}

// --- Chat history (localStorage) ---
const CHAT_KEY = 'bot_chat_history';
function getChatHistory() {
    const data = localStorage.getItem(CHAT_KEY);
    return data ? JSON.parse(data) : [];
}
function saveChatHistory(history) {
    localStorage.setItem(CHAT_KEY, JSON.stringify(history));
}
function clearChat() {
    localStorage.removeItem(CHAT_KEY);
    document.getElementById('chat').innerHTML = '';
}

// --- UI helpers ---
function appendMessage(sender, text) {
    const chatDiv = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = `msg ${sender.toLowerCase()}`;
    div.innerHTML = `<strong>${sender}:</strong> ${text.replace(/\n/g, '<br>')}`;
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

// --- Search engine functions ---
async function googleSearch(query) {
    if (USE_WIKIPEDIA_FALLBACK) {
        // Wikipedia API (free, no key)
        const url = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
        const res = await fetch(url);
        const data = await res.json();
        const results = data.query.search.slice(0, 5).map(item => ({
            title: item.title,
            snippet: item.snippet.replace(/<\/?[^>]+(>|$)/g, ""), // strip HTML
            link: `https://en.wikipedia.org/wiki/${encodeURIComponent(item.title)}`
        }));
        return results;
    } else {
        // Google Custom Search JSON API
        const url = `https://www.googleapis.com/customsearch/v1?key=${GOOGLE_CSE_KEY}&cx=${GOOGLE_CSE_CX}&q=${encodeURIComponent(query)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.items) return [];
        return data.items.slice(0, 5).map(item => ({
            title: item.title,
            snippet: item.snippet,
            link: item.link
        }));
    }
}

// --- Learn from Google (memory download) ---
async function learnFromGoogle() {
    const query = document.getElementById('learnQuery').value.trim();
    if (!query) return alert('Please enter a search query');

    appendMessage('System', `🔍 Searching Google for "${query}"...`);
    try {
        const results = await googleSearch(query);
        if (results.length === 0) {
            appendMessage('Bot', 'Koi results nahi mile.');
            return;
        }

        // Save whole search session to memory
        const memoryItem = {
            query: query,
            results: results,
            timestamp: new Date().toISOString()
        };
        addMemoryItem(memoryItem);

        // Show snippet of what was saved
        let summary = `✅ **Memory mein save ho gaya!** (${results.length} results)\n`;
        results.forEach((r, i) => {
            summary += `${i+1}. **${r.title}** - ${r.snippet.substring(0,100)}... [link](${r.link})\n`;
        });
        appendMessage('Bot', summary);
        document.getElementById('learnQuery').value = '';
    } catch (err) {
        appendMessage('Bot', '❌ Google search fail hua. API key/CSE ID check karein ya Wikipedia fallback enable karein.');
        console.error(err);
    }
}

// --- Retrieve relevant memory chunks ---
function retrieveMemoryContext(userMessage) {
    const memory = getMemory();
    if (memory.length === 0) return '';

    // Simple keyword matching: search user's query words in each result's snippet+title
    const words = userMessage.toLowerCase().split(/\s+/).filter(w => w.length > 2);
    let bestChunks = [];
    memory.forEach(item => {
        item.results.forEach(r => {
            const text = (r.title + ' ' + r.snippet).toLowerCase();
            let score = 0;
            words.forEach(word => {
                if (text.includes(word)) score++;
            });
            if (score > 0) bestChunks.push({ score, text: `Title: ${r.title}\nSnippet: ${r.snippet}\nLink: ${r.link}` });
        });
    });
    // Sort by score and take top 3
    bestChunks.sort((a,b) => b.score - a.score);
    return bestChunks.slice(0, 3).map(c => c.text).join('\n\n');
}

// --- Send message to AI ---
async function sendMessage() {
    const input = document.getElementById('userInput');
    const userMsg = input.value.trim();
    if (!userMsg) return;

    appendMessage('You', userMsg);
    input.value = '';

    // Save to chat history
    const history = getChatHistory();
    history.push({ role: 'user', content: userMsg });

    // Retrieve memory context
    const memoryContext = retrieveMemoryContext(userMsg);
    let systemMsg = "You are a helpful AI assistant. Use the provided 'Memory Context' to answer accurately. If the memory doesn't help, use your own knowledge. Always cite sources if from memory. Answer in Hindi or English as the user prefers.";
    let messages = [{ role: 'system', content: systemMsg }];
    if (memoryContext) {
        messages.push({ role: 'system', content: `Memory Context:\n${memoryContext}` });
    }
    // Add recent chat history (last 6 messages)
    const recentHistory = history.slice(-6);
    messages = messages.concat(recentHistory);

    // Call OpenAI API
    if (!OPENAI_API_KEY || OPENAI_API_KEY === 'sk-...') {
        appendMessage('Bot', '⚠️ Pehle code mein apni OPENAI_API_KEY daalo.');
        return;
    }
    try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${OPENAI_API_KEY}`
            },
            body: JSON.stringify({
                model: 'gpt-3.5-turbo',
                messages: messages,
                temperature: 0.7,
                max_tokens: 500
            })
        });
        const data = await response.json();
        if (data.error) {
            appendMessage('Bot', `Error: ${data.error.message}`);
            return;
        }
        const botReply = data.choices[0].message.content;

        // Display & save
        appendMessage('Bot', botReply);
        history.push({ role: 'assistant', content: botReply });
        saveChatHistory(history);
    } catch (err) {
        appendMessage('Bot', '❌ API call fail. Network ya key check karein.');
        console.error(err);
    }
}

// --- Page load ---
window.onload = function() {
    // Load existing chat history
    const history = getChatHistory();
    history.forEach(msg => {
        appendMessage(msg.role === 'user' ? 'You' : 'Bot', msg.content);
    });
    updateMemoryCount();
    // Enter key send kare
    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
    document.getElementById('learnQuery').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') learnFromGoogle();
    });
};
</script>
</body>
</html>
